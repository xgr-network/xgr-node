name: v3.1.5 Open Route Protocol (draft)

on:
  push:
    branches: [feature/interchain-v315-route-instances]
  pull_request:
    branches: [XGR3.0]

permissions:
  contents: read

jobs:
  route-codec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check Go formatting
        run: |
          test -z "$(gofmt -l consensus/ibft/interchain/iln_v315_route_instance*.go)"
      - name: Test route identity and safety proof codec
        run: go test -count=1 ./consensus/ibft/interchain -run 'TestXITAOpenRouteInstance|TestXITARouteSafety'
