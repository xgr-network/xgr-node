name: Release Light (XGR v3.5.10 Interchain Catch-up and BSC Witnesses)

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: "Reviewed XGR3.0 40-character commit SHA"
        required: true
        type: string
      confirmation:
        description: "Type RELEASE-v3.5.10 to publish"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: xgr-v3510-light-release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.ref == 'refs/heads/XGR3.0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact interchain RPC release scope
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/XGR3.0'
          test "$CONFIRMATION" = 'RELEASE-v3.5.10'
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$(git rev-parse refs/tags/v3.5.9)" = '6fd2dfac114aa8b0522f8a5a85dab710186b2502'
          git merge-base --is-ancestor refs/tags/v3.5.9 HEAD
          if git rev-parse -q --verify refs/tags/v3.5.10 >/dev/null; then
            echo "v3.5.10 already exists: refusing overwrite" >&2
            exit 1
          fi
          diff -u <(printf '%s\n' \
            '.github/workflows/release-light-v3510.yml' \
            '.github/workflows/release-light-v359.yml' \
            'RELEASE_NOTES_v3.5.10.md' \
            'interchain/config.go' \
            'interchain/evm/config.go' \
            'interchain/evm/iln_binding_cache.go' \
            'interchain/evm/iln_direct_operation.go' \
            'interchain/evm/iln_multi_gateway_scan.go' \
            'interchain/evm/iln_multi_gateway_scan_test.go' \
            'interchain/evm/iln_receipt_pinned_full_rpc_test.go' \
            'interchain/evm/rpc_evidence_quorum.go' \
            'interchain/evm/rpc_evidence_quorum_integration_test.go' \
            'interchain/runtime/iln_indexer_health.go' \
            'interchain/runtime/iln_observer_worker.go' \
            'interchain/runtime/iln_observer_worker_test.go' \
            'interchain/runtime/iln_scan_catchup.go' | LC_ALL=C sort) \
            <(git diff --no-renames --name-only refs/tags/v3.5.9 HEAD | LC_ALL=C sort)
          test "$(git diff --diff-filter=D --name-only refs/tags/v3.5.9 HEAD -- .github/workflows/release-light-v359.yml)" = '.github/workflows/release-light-v359.yml'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Interchain, Direct-BLS and JSON-RPC regression
        run: go test -count=1 -timeout 15m ./interchain/... ./consensus/ibft/interchain ./jsonrpc
      - name: Repeat bounded scanner, provider failover and independent source evidence checks
        run: |
          set -euo pipefail
          go test -count=3 -timeout 8m ./interchain/evm -run '^(TestMultiGateway429FailsOverSameWindow|TestGatewayScanSessionReusesSmallerProviderRange|TestReceiptPinnedDirectBLSFullRPCSecurityMatrix|TestTwoIndependentOperatorsWithFailover|TestOneOperatorAndConflictingProvidersFailClosed)$'
          go test -count=3 -timeout 8m ./interchain/runtime -run '^(TestSharedILNObserverReducesExternalRequestsAndPreservesDurableCursors|TestSharedObserverCatchupThroughputAndPartialProgress|TestILNDiscoverOnlyCanonicalPermissionlessRoutesAndPersistCursor|TestILNDiscoveryRejectsMismatchedGatewayAndDoesNotAdvance)$'
      - name: Build verified immutable Linux release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          COMMIT="$(git rev-parse --short HEAD)"
          TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          PKG="$(go list -m)/versioning"
          go build -trimpath -o dist/xgrchain-v3.5.10-linux-amd64 \
            -ldflags "-X $PKG.Version=v3.5.10 -X $PKG.Commit=$COMMIT -X $PKG.Branch=XGR3.0 -X $PKG.BuildTime=$TIME" .
          chmod 755 dist/xgrchain-v3.5.10-linux-amd64
          VERSION_OUTPUT="$(./dist/xgrchain-v3.5.10-linux-amd64 version)"
          printf '%s\n' "$VERSION_OUTPUT"
          grep -Fq 'Release version' <<< "$VERSION_OUTPUT"
          grep -Fq 'v3.5.10' <<< "$VERSION_OUTPUT"
          grep -Fq "$COMMIT" <<< "$VERSION_OUTPUT"
          printf '%s\n' v3.5.10 > dist/version.txt
          git rev-parse HEAD > dist/commit.txt
          go version > dist/toolchain.txt
          (cd dist && sha256sum xgrchain-v3.5.10-linux-amd64 version.txt commit.txt toolchain.txt > sha256sums.txt)
          (cd dist && sha256sum -c sha256sums.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: xgr-v3.5.10-interchain-catchup-and-bsc-witnesses-light-amd64
          path: dist/
          retention-days: 30
          if-no-files-found: error
      - name: Publish immutable v3.5.10 GitHub release (no validator deployment)
        uses: ncipollo/release-action@v1
        with:
          tag: v3.5.10
          name: v3.5.10
          commit: ${{ github.sha }}
          allowUpdates: false
          makeLatest: true
          generateReleaseNotes: false
          artifacts: dist/*
          bodyFile: RELEASE_NOTES_v3.5.10.md
