name: Release Light (XGR v3.3.2 Direct BLS)

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: "Reviewed full XGR3.0 commit SHA (40 lowercase hex)"
        required: true
        type: string
      confirmation:
        description: "Type RELEASE-v3.3.2 to authorize light release"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: xgr-v332-direct-light-release
  cancel-in-progress: false

jobs:
  build-and-release:
    if: ${{ github.ref == 'refs/heads/XGR3.0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pin reviewed commit, scope, tag and manual approval
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          CONFIRMATION: ${{ inputs.confirmation }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = 'RELEASE-v3.3.2'
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$GITHUB_REF" = 'refs/heads/XGR3.0'
          test "$(git rev-parse v3.3.1)" = 'e6fecf8de08e7261afb24014b3d2d56ccbc8eb40'
          if git rev-parse -q --verify refs/tags/v3.3.2 >/dev/null || gh api "repos/${{ github.repository }}/git/ref/tags/v3.3.2" >/dev/null 2>&1; then
            echo 'Immutable v3.3.2 release already exists' >&2
            exit 1
          fi
          git diff --name-only v3.3.0 HEAD > /tmp/xgr-light-scope.txt
          test -s /tmp/xgr-light-scope.txt
          if grep -Ev '^(interchain/|consensus/ibft/interchain_runtime.go|consensus/ibft/interchain/iln_protocol.go|jsonrpc/xgr_interchain_validators_test.go|merkle-tree/|docs/XGR_INTERCHAIN_V332.md|\.github/workflows/(release-light-v332|release-direct-bls-candidate)\.yml)' /tmp/xgr-light-scope.txt; then
            echo 'Release includes non-Interchain source modifications' >&2
            exit 1
          fi

      - name: Forbid EVM, state, slashing and core IBFT changes
        run: |
          set -euo pipefail
          if git diff --name-only v3.3.1 HEAD -- consensus/ibft |
             grep -Ev '^consensus/ibft/(interchain_runtime.go|interchain/iln_protocol.go)
        with:
          go-version: '1.23.x'
          cache: true

      - name: Verify direct BLS invariant and removed Merkle source
        run: |
          set -euo pipefail
          test -f consensus/ibft/interchain/xita_direct_message.go
          test -f interchain/evm/iln_direct_operation.go
          test -f interchain/runtime/iln_direct_signing.go
          test ! -e interchain/evm/iln_merkle.go
          test ! -e interchain/runtime/iln_replica_network.go
          test ! -e jsonrpc/xgr_iln_replica_proof.go
          test ! -e interchain/evm/xita_direct_source.go
          grep -q 'XITA_DIRECT_MESSAGE_V1' consensus/ibft/interchain/xita_direct_message.go
          grep -q 'verifyDirectILNEvidence' interchain/runtime/iln_direct_signing.go
          grep -q 'VerifyConfirmedILNFeeAllocation' interchain/evm/iln_direct_operation.go

      - name: Full Go regression suite (including IBFT and state)
        run: go test -count=1 -timeout 20m ./...
      - name: Focused direct BLS and ILN unit tests
        run: |
          set -euo pipefail
          go test -count=1 -timeout 12m ./consensus/ibft/interchain ./interchain/evm ./interchain/runtime ./jsonrpc
          go test -count=3 ./consensus/ibft/interchain -run '^TestXITADirectMessage'
          go test -count=3 ./interchain/evm -run '^TestDirect'
          go test -count=3 ./jsonrpc -run '^TestXGRGetILN'

      - name: Build official v3.3.2 Linux binary and checksums
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSION=v3.3.2
          PKG=github.com/xgr-network/xgrchain/versioning
          COMMIT="$(git rev-parse --short HEAD)"
          TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          go build -trimpath -o dist/xgrchain-v3.3.2-linux-amd64 \
            -ldflags "-X ${PKG}.Version=${VERSION} -X ${PKG}.Commit=${COMMIT} -X ${PKG}.Branch=XGR3.0 -X ${PKG}.BuildTime=${TIME}" .
          chmod 755 dist/xgrchain-v3.3.2-linux-amd64
          ./dist/xgrchain-v3.3.2-linux-amd64 version
          printf '%s\n' v3.3.2 > dist/version.txt
          git rev-parse HEAD > dist/commit.txt
          (cd dist && sha256sum xgrchain-v3.3.2-linux-amd64 version.txt commit.txt > sha256sums.txt)
          (cd dist && sha256sum -c sha256sums.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: xgr-v3.3.2-direct-bls-light-linux-amd64
          path: dist/
          retention-days: 30
          if-no-files-found: error

      - name: Publish immutable v3.3.2 light release
        uses: ncipollo/release-action@v1
        with:
          tag: v3.3.2
          name: v3.3.2
          commit: ${{ github.sha }}
          allowUpdates: false
          makeLatest: true
          generateReleaseNotes: false
          body: |
            XGR v3.3.2 Direct-BLS Interchain transport.
            No general consensus, EVM or state-transition changes.
            Light release: full Go suite + focused Interchain regressions, no full EEST/ForkGate.
            Interchain signer disabled until v3.3.3 receipt-pinned contract bindings;
            coordinate validator Interchain rollout before attempting transfers.
            No Contract addresses or consensus-code changes are shipped in v3.3.2.
          artifacts: dist/*
; then
            echo "Consensus-critical IBFT modifications are forbidden" >&2
            exit 1
          fi
          test ! -n "$(git diff --name-only v3.3.1 HEAD -- blockchain/ state/ contracts/staking/)"
          grep -q 'if len(destinations) == 0' consensus/ibft/interchain_runtime.go
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: Verify direct BLS invariant and removed Merkle source
        run: |
          set -euo pipefail
          test -f consensus/ibft/interchain/xita_direct_message.go
          test -f interchain/evm/iln_direct_operation.go
          test -f interchain/runtime/iln_direct_signing.go
          test ! -e interchain/evm/iln_merkle.go
          test ! -e interchain/runtime/iln_replica_network.go
          test ! -e jsonrpc/xgr_iln_replica_proof.go
          test ! -e interchain/evm/xita_direct_source.go
          grep -q 'XITA_DIRECT_MESSAGE_V1' consensus/ibft/interchain/xita_direct_message.go
          grep -q 'verifyDirectILNEvidence' interchain/runtime/iln_direct_signing.go
          grep -q 'VerifyConfirmedILNFeeAllocation' interchain/evm/iln_direct_operation.go

      - name: Focused direct BLS and ILN unit tests
        run: |
          set -euo pipefail
          go test -count=1 -timeout 12m ./consensus/ibft/interchain ./interchain/evm ./interchain/runtime ./jsonrpc
          go test -count=3 ./consensus/ibft/interchain -run '^TestXITADirectMessage'
          go test -count=3 ./interchain/evm -run '^TestDirect'
          go test -count=3 ./jsonrpc -run '^TestXGRGetILN'

      - name: Build official v3.3.2 Linux binary and checksums
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSION=v3.3.2
          PKG=github.com/xgr-network/xgrchain/versioning
          COMMIT="$(git rev-parse --short HEAD)"
          TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          go build -trimpath -o dist/xgrchain-v3.3.2-linux-amd64 \
            -ldflags "-X ${PKG}.Version=${VERSION} -X ${PKG}.Commit=${COMMIT} -X ${PKG}.Branch=XGR3.0 -X ${PKG}.BuildTime=${TIME}" .
          chmod 755 dist/xgrchain-v3.3.2-linux-amd64
          ./dist/xgrchain-v3.3.2-linux-amd64 version
          printf '%s\n' v3.3.2 > dist/version.txt
          git rev-parse HEAD > dist/commit.txt
          (cd dist && sha256sum xgrchain-v3.3.2-linux-amd64 version.txt commit.txt > sha256sums.txt)
          (cd dist && sha256sum -c sha256sums.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: xgr-v3.3.2-direct-bls-light-linux-amd64
          path: dist/
          retention-days: 30
          if-no-files-found: error

      - name: Publish immutable v3.3.2 light release
        uses: ncipollo/release-action@v1
        with:
          tag: v3.3.2
          name: v3.3.2
          commit: ${{ github.sha }}
          allowUpdates: false
          makeLatest: true
          generateReleaseNotes: false
          body: |
            XGR v3.3.2 Direct-BLS Interchain transport.
            No general consensus, EVM or state-transition changes.
            Light release: focused interchain/security tests, no full EEST/ForkGate.
            Interchain P2P protocol is incompatible with v3.3.0;
            coordinate validator Interchain rollout before attempting transfers.
            Deployment of matching new Direct-BLS contracts is required.
          artifacts: dist/*
