name: Release Light (XGR v3.5.3 Generic Receipt-Pinned Direct-BLS)

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: "Reviewed XGR3.0 40-character commit SHA"
        required: true
        type: string
      confirmation:
        description: "Type RELEASE-v3.5.3 to publish"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: xgr-v353-light-release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.ref == 'refs/heads/XGR3.0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact reviewed source and interchain-only changes
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/XGR3.0'
          test "$CONFIRMATION" = 'RELEASE-v3.5.3'
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          git rev-parse -q --verify refs/tags/v3.5.2 >/dev/null
          git merge-base --is-ancestor "$(git rev-parse v3.5.2)" HEAD
          if git rev-parse -q --verify refs/tags/v3.5.3 >/dev/null; then
            echo "v3.5.3 already exists: refusing overwrite" >&2
            exit 1
          fi
          git diff --name-only v3.5.2 HEAD > /tmp/v353-changes
          test -s /tmp/v353-changes
          # Exact reviewed source areas; no chain policy, ECDSA, consensus,
          # staking, cryptography, node P2P, txpool, or destination deployment.
          if grep -Ev '^(interchain/evm/(iln_direct_operation(_test)?[.]go|iln_receipt_pinned_full_rpc_test[.]go|rpc_evidence_quorum[.]go)|interchain/runtime/(iln_direct_signing[.]go|iln_observer_(retry|worker)(_test)?[.]go|iln_quorum_request[.]go)|jsonrpc/xgr_iln_quorum(_test)?[.]go|docs/ILN_RECEIPT_PINNED_QUORUM_SECURITY[.]md|RELEASE_NOTES_v3[.]5[.]3[.]md|[.]github/workflows/release-light-v353[.]yml)$' /tmp/v353-changes; then
            echo "v3.5.3 contains changes outside the reviewed Direct-BLS scope" >&2
            exit 1
          fi
          grep -Fxq 'interchain/evm/iln_direct_operation.go' /tmp/v353-changes
          grep -Fxq 'interchain/evm/rpc_evidence_quorum.go' /tmp/v353-changes
          grep -Fxq 'interchain/evm/iln_receipt_pinned_full_rpc_test.go' /tmp/v353-changes
          grep -Fxq 'interchain/runtime/iln_direct_signing.go' /tmp/v353-changes
          grep -Fxq 'interchain/runtime/iln_quorum_request.go' /tmp/v353-changes
          grep -Fxq 'jsonrpc/xgr_iln_quorum.go' /tmp/v353-changes
          grep -Fxq '.github/workflows/release-light-v353.yml' /tmp/v353-changes
          test -f RELEASE_NOTES_v3.5.3.md
          test -z "$(git diff --name-only v3.5.2 HEAD -- interchain/config.go consensus/ blockchain/ state/ chain/ contracts/ command/ crypto/ txpool/ network/)"
          # The older legacy quorum RPC and event-discovery entry points must
          # remain present; the new hash is a locator, never a signature.
          grep -q 'func GetQuorumVerifiedDirectILNOperationByTx' interchain/evm/rpc_evidence_quorum.go
          grep -q 'func GetQuorumVerifiedDirectILNOperation(' interchain/evm/rpc_evidence_quorum.go
          grep -q 'func GetDirectILNOperationByTx' interchain/evm/iln_direct_operation.go
          grep -q 'func (x \*xgrEndpoint) RequestILNQuorumWithSourceTx' jsonrpc/xgr_iln_quorum.go
          grep -q 'func (x \*xgrEndpoint) RequestILNQuorum(' jsonrpc/xgr_iln_quorum.go
          echo "Reviewed v3.5.3 Interchain source scope verified"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Full interchain and Direct-BLS compatibility regression
        shell: bash
        run: |
          set -euo pipefail
          go test -count=3 -timeout 15m ./interchain/... ./consensus/ibft/interchain ./jsonrpc
      - name: Repeat chain-generic receipt quorum and fail-closed matrix
        shell: bash
        run: |
          set -euo pipefail
          go test -count=8 -timeout 10m ./interchain/evm -run '^(TestReceiptPinnedDirectBLSFullRPCSecurityMatrix|TestPinnedSourceReceipt|TestTwoIndependentOperatorsWithFailover|TestOneOperatorAndConflictingProvidersFailClosed)$'
          go test -count=5 -timeout 8m ./interchain/runtime -run '^(TestObserverRetry|TestSharedILNObserver|TestSharedObserver)'
          go test -count=5 -timeout 8m ./jsonrpc -run '^(TestReceiptPinnedQuorumHint|TestILNQuorumRequest)'
      - name: Build verified immutable Linux release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          COMMIT="$(git rev-parse --short HEAD)"
          TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          PKG="$(go list -m)/versioning"
          go build -trimpath -o dist/xgrchain-v3.5.3-linux-amd64 \
            -ldflags "-X $PKG.Version=v3.5.3 -X $PKG.Commit=$COMMIT -X $PKG.Branch=XGR3.0 -X $PKG.BuildTime=$TIME" .
          chmod 755 dist/xgrchain-v3.5.3-linux-amd64
          VERSION_OUTPUT="$(./dist/xgrchain-v3.5.3-linux-amd64 version)"
          printf '%s\n' "$VERSION_OUTPUT"
          grep -Fq 'Release version' <<< "$VERSION_OUTPUT"
          grep -Fq 'v3.5.3' <<< "$VERSION_OUTPUT"
          grep -Fq "$COMMIT" <<< "$VERSION_OUTPUT"
          printf '%s\n' v3.5.3 > dist/version.txt
          git rev-parse HEAD > dist/commit.txt
          go version > dist/toolchain.txt
          (cd dist && sha256sum xgrchain-v3.5.3-linux-amd64 version.txt commit.txt toolchain.txt > sha256sums.txt)
          (cd dist && sha256sum -c sha256sums.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: xgr-v3.5.3-direct-bls-receipt-light-amd64
          path: dist/
          retention-days: 30
          if-no-files-found: error
      - name: Publish immutable v3.5.3 GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: v3.5.3
          name: v3.5.3
          commit: ${{ github.sha }}
          allowUpdates: false
          makeLatest: true
          generateReleaseNotes: false
          artifacts: dist/*
          bodyFile: RELEASE_NOTES_v3.5.3.md
