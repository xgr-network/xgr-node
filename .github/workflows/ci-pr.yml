name: CI (PR)

on:
  pull_request:
    branches: ["main", "XGR3.0"]
  workflow_dispatch:

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true

      - name: Go test (unit)
        run: |
          set -euo pipefail
          pkgs=$(go list ./... | grep -vE '(/e2e($|/)|/e2e-polybft($|/)|/tests($|/)|/tracker($|/)|/command/rootchain/deploy($|/)|/consensus/polybft($|/)|/state/runtime/evm($|/))')
          go test -count=1 -short $pkgs

      - name: ILN archive-independent route E2E
        run: go test -count=1 ./e2e -run '^TestInterchainILNRoutesE2E$' -v

      - name: ILN three-validator replica, route discovery and restart E2E
        run: |
          set -euo pipefail
          go test -count=1 ./interchain/runtime \
            -run '^(TestV322ThreeValidatorDivergentHeadMerkleP2PE2E|TestILNReplicaThreeAuthenticatedLibp2pValidatorsE2E|TestILNRoutePeerDiscoveryThreeValidatorsWithoutHistoricalLogs|TestILNValidatorRestartRetainsVerifiedReplicaAndPerSetCursor)$' \
            -v -timeout 180s

      - name: Go build
        run: go build ./...
