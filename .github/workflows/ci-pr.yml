name: CI (PR)

on:
  pull_request:
    branches: ["main", "XGR3.0"]
  workflow_dispatch:

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.23.x"
          cache: true

      - name: Validate GitHub Actions syntax
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          for workflow in sorted(Path(".github/workflows").glob("*.yml")):
              with workflow.open(encoding="utf-8") as handle:
                  yaml.safe_load(handle)
              print("YAML OK:", workflow)
          PY

      - name: Go test (all unit packages, no short mode)
        run: bash scripts/ci/unit-tests.sh

      - name: Upload unit test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-unit-tests
          path: artifacts/unit-tests/
          if-no-files-found: error
          retention-days: 14

      - name: Build node for security consensus E2E
        run: |
          mkdir -p bin
          go build -trimpath -o ./bin/xgrchain .

      - name: Security accounting four-validator fork boundary
        run: |
          XGRCHAIN_BINARY="$PWD/bin/xgrchain" go test -count=1 -timeout 5m ./e2e \
            -run '^TestSecurityAccountingFourValidators$' -v

      - name: ILN archive-independent route E2E
        run: go test -count=1 ./e2e -run '^TestInterchainILNRoutesE2E$' -v

      - name: ILN three-validator replica, route discovery and restart E2E
        run: |
          set -euo pipefail
          go test -count=1 ./interchain/runtime \
            -run '^(TestILNReplicaThreeAuthenticatedLibp2pValidatorsE2E|TestILNRoutePeerDiscoveryThreeValidatorsWithoutHistoricalLogs|TestILNValidatorRestartRetainsVerifiedReplicaAndPerSetCursor)$' \
            -v -timeout 180s

      - name: Go build
        run: go build ./...
