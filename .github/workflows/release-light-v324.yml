name: Release Light (XGR v3.2.4)

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: "Reviewed full XGR3.0 commit SHA (40 hex characters)"
        required: true
        type: string
      confirmation:
        description: "Type RELEASE-v3.2.4 to acknowledge focused tests only (no full EEST/ForkGate)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: xgr-v324-light-release
  cancel-in-progress: false

jobs:
  build-and-release:
    if: ${{ github.ref == 'refs/heads/XGR3.0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pin reviewed commit and verify manual release approval
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          CONFIRMATION: ${{ inputs.confirmation }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = 'RELEASE-v3.2.4' || { echo "Approval text mismatch" >&2; exit 1; }
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "Expected SHA must be full 40 hex" >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT" || { echo "Requested commit differs from checked out source" >&2; exit 1; }
          test "$GITHUB_REF" = "refs/heads/XGR3.0" || { echo "Unexpected release branch" >&2; exit 1; }
          if gh api repos/${{ github.repository }}/git/ref/tags/v3.2.4 >/dev/null 2>&1; then
            echo "Immutable v3.2.4 tag already exists; refusing overwrite" >&2
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: Require v3.2.4 regressions and scoped unit tests
        run: |
          set -euo pipefail
          grep -Eq '^func TestILNRPCDiscoveryCursorMigrationRejectsNumericallyPlausibleL1Height' interchain/runtime/iln_discovery_test.go || {
            echo "Missing explicit v3.2.4 ILN regressions: release refused" >&2
            exit 1
          }
          go test -count=1 -short ./interchain/evm ./interchain/runtime ./jsonrpc
          go test -count=5 ./interchain/evm -run '^TestParseILNRouteNameCanonical$' -v
          go test -count=5 ./jsonrpc -run '^TestILNUnknownCanonicalRouteCreatesHintNotSigningAdmission$' -v

      - name: Three-validator ILN replica, route, restart and release regressions
        run: |
          set -euo pipefail
          go test -count=1 ./interchain/runtime \
            -run '^(TestV322.*|TestILNReplicaThreeAuthenticatedLibp2pValidatorsE2E|TestILNRoutePeerDiscoveryThreeValidatorsWithoutHistoricalLogs|TestILNValidatorRestartRetainsVerifiedReplicaAndPerSetCursor)$' \
            -timeout 180s -v

      - name: Source-to-destination ILN route E2E
        run: |
          set -euo pipefail
          go test -count=5 ./interchain/runtime -run '^(TestILNRPCDiscoveryCursorMigrationRejectsNumericallyPlausibleL1Height|TestILNHintDiscoveryRequiresCanonicalRegistryProof|TestILNDiscoveryRecoversPersistedL1HeightOnL2|TestILNDiscoveryRejectsMismatchedGatewayAndDoesNotAdvance|TestILNDiscoveryRetryOnTransientRegistryFailure)$' -v
          go test -count=1 ./e2e -run '^TestInterchainILNRoutesE2E$' -v -timeout 180s

      - name: Build reproducibly attributed official v3.2.4 binary
        run: |
          set -euo pipefail
          mkdir -p dist
          COMMIT="$(git rev-parse --short HEAD)"
          TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          PKG=github.com/xgr-network/xgrchain/versioning
          VERSION=v3.2.4
          go build -trimpath -o dist/xgrchain-v3.2.4-linux-amd64 \
            -ldflags "-X ${PKG}.Version=${VERSION} -X ${PKG}.Commit=${COMMIT} -X ${PKG}.Branch=XGR3.0 -X ${PKG}.BuildTime=${TIME}" .
          chmod 755 dist/xgrchain-v3.2.4-linux-amd64
          ./dist/xgrchain-v3.2.4-linux-amd64 version
          printf '%s\n' 'v3.2.4' > dist/version.txt
          (cd dist && sha256sum xgrchain-v3.2.4-linux-amd64 version.txt > sha256sums.txt)
          (cd dist && sha256sum -c sha256sums.txt)
          test -s dist/xgrchain-v3.2.4-linux-amd64

      - uses: actions/upload-artifact@v4
        with:
          name: xgr-v3.2.4-light-linux-amd64
          path: dist/
          retention-days: 30

      - name: Publish immutable signed-off light release artifact
        uses: ncipollo/release-action@v1
        with:
          tag: v3.2.4
          name: v3.2.4
          commit: ${{ github.sha }}
          makeLatest: true
          allowUpdates: false
          generateReleaseNotes: false
          body: |
            XGR-Node v3.2.4 ILN L1/L2 source-RPC route discovery light release.
            No changes to IBFT consensus, state transition, BLS threshold,
            or deployed contracts are permitted in this release scope.
            Focused ILN, regression and three-validator tests passed.
            The full EEST / ForkGate suites were NOT run.
            A release tag is not deployment: use backups and a rolling,
            one-validator-at-a-time deployment, verifying XGR consensus,
            ILN replicas and 2/3 quorum after each node.
          artifacts: 'dist/*'
