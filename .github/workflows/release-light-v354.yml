name: Release Light (XGR v3.5.4 RPC Backpressure Direct-BLS)

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: "Reviewed XGR3.0 40-character commit SHA"
        required: true
        type: string
      confirmation:
        description: "Type RELEASE-v3.5.4 to publish"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: xgr-v354-light-release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.ref == 'refs/heads/XGR3.0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact reviewed source and interchain-only changes
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/XGR3.0'
          test "$CONFIRMATION" = 'RELEASE-v3.5.4'
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          git rev-parse -q --verify refs/tags/v3.5.3 >/dev/null
          git merge-base --is-ancestor "$(git rev-parse v3.5.3)" HEAD
          if git rev-parse -q --verify refs/tags/v3.5.4 >/dev/null; then
            echo "v3.5.4 already exists: refusing overwrite" >&2
            exit 1
          fi
          git diff --name-only v3.5.3 HEAD > /tmp/v354-changes
          test -s /tmp/v354-changes
          # Narrow diff allowlist: reviewed external source RPC throttling,
          # durable retry sidecars, receipt-first verification and tests only.
          if grep -Ev '^(interchain/evm/(iln_direct_operation[.]go|iln_receipt_pinned_full_rpc_test[.]go|rpc_failover(_test)?[.]go)|interchain/runtime/(iln_direct_signing[.]go|iln_message_backoff(_test)?[.]go|iln_observer_retry[.]go|iln_quorum_request[.]go|worker[.]go)|RELEASE_NOTES_v3[.]5[.]4[.]md|[.]github/workflows/release-light-v354[.]yml)$' /tmp/v354-changes; then
            echo "v3.5.4 contains changes outside reviewed source-RPC backpressure scope" >&2
            exit 1
          fi
          for file in \
            interchain/evm/iln_direct_operation.go \
            interchain/evm/rpc_failover.go \
            interchain/runtime/iln_message_backoff.go \
            interchain/runtime/iln_direct_signing.go \
            interchain/runtime/iln_quorum_request.go \
            .github/workflows/release-light-v354.yml; do
            grep -Fxq "$file" /tmp/v354-changes
          done
          test -f RELEASE_NOTES_v3.5.4.md
          test -z "$(git diff --name-only v3.5.3 HEAD -- interchain/config.go consensus/ blockchain/ state/ chain/ contracts/ command/ crypto/ txpool/ network/)"
          grep -q 'func GetQuorumVerifiedDirectILNOperationByTx' interchain/evm/rpc_evidence_quorum.go
          grep -q 'func GetQuorumVerifiedDirectILNOperation(' interchain/evm/rpc_evidence_quorum.go
          grep -q 'func (w \*Worker) signDirectILNMessageWithTx' interchain/runtime/iln_direct_signing.go
          grep -q 'func (w \*Worker) beginILNEvidenceRetry' interchain/runtime/iln_message_backoff.go
          grep -q 'func (x \*xgrEndpoint) RequestILNQuorumWithSourceTx' jsonrpc/xgr_iln_quorum.go
          grep -q 'func (x \*xgrEndpoint) RequestILNQuorum(' jsonrpc/xgr_iln_quorum.go
          echo "Reviewed v3.5.4 Interchain source scope verified"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Full interchain and Direct-BLS compatibility regression
        shell: bash
        run: |
          set -euo pipefail
          go test -count=3 -timeout 15m ./interchain/... ./consensus/ibft/interchain ./jsonrpc
      - name: Repeat chain-generic receipt quorum and fail-closed matrix
        shell: bash
        run: |
          set -euo pipefail
          go test -count=5 -timeout 10m ./interchain/evm -run '^(TestReceiptPinnedDirectBLSFullRPCSecurityMatrix|TestPinnedSourceReceiptUnavailableSkipsExpensiveRegistryAndFeeVaultCalls|TestRPCProviderPlanQuotaAndForbiddenCooldown|TestPinnedSourceReceipt|TestTwoIndependentOperatorsWithFailover|TestOneOperatorAndConflictingProvidersFailClosed)'
          go test -count=5 -timeout 8m ./interchain/runtime -run '^(TestILNEvidenceRetry|TestObserverRetry|TestSharedILNObserver|TestSharedObserver)'
          go test -count=5 -timeout 8m ./jsonrpc -run '^(TestReceiptPinnedQuorumHint|TestILNQuorumRequest)'
      - name: Build verified immutable Linux release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          COMMIT="$(git rev-parse --short HEAD)"
          TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          PKG="$(go list -m)/versioning"
          go build -trimpath -o dist/xgrchain-v3.5.4-linux-amd64 \
            -ldflags "-X $PKG.Version=v3.5.4 -X $PKG.Commit=$COMMIT -X $PKG.Branch=XGR3.0 -X $PKG.BuildTime=$TIME" .
          chmod 755 dist/xgrchain-v3.5.4-linux-amd64
          VERSION_OUTPUT="$(./dist/xgrchain-v3.5.4-linux-amd64 version)"
          printf '%s\n' "$VERSION_OUTPUT"
          grep -Fq 'Release version' <<< "$VERSION_OUTPUT"
          grep -Fq 'v3.5.4' <<< "$VERSION_OUTPUT"
          grep -Fq "$COMMIT" <<< "$VERSION_OUTPUT"
          printf '%s\n' v3.5.4 > dist/version.txt
          git rev-parse HEAD > dist/commit.txt
          go version > dist/toolchain.txt
          (cd dist && sha256sum xgrchain-v3.5.4-linux-amd64 version.txt commit.txt toolchain.txt > sha256sums.txt)
          (cd dist && sha256sum -c sha256sums.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: xgr-v3.5.4-direct-bls-backpressure-light-amd64
          path: dist/
          retention-days: 30
          if-no-files-found: error
      - name: Publish immutable v3.5.4 GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: v3.5.4
          name: v3.5.4
          commit: ${{ github.sha }}
          allowUpdates: false
          makeLatest: true
          generateReleaseNotes: false
          artifacts: dist/*
          bodyFile: RELEASE_NOTES_v3.5.4.md
