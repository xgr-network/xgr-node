name: Release Light (XGR v3.5.2 BSC RPC Witness Redundancy)
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: "Reviewed XGR3.0 40-character commit SHA"
        required: true
        type: string
      confirmation:
        description: "Type RELEASE-v3.5.2 to publish"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: xgr-v352-light-release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.ref == 'refs/heads/XGR3.0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify frozen commit, v3.5.1 baseline and restricted scope
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/XGR3.0'
          test "$CONFIRMATION" = 'RELEASE-v3.5.2'
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          git rev-parse -q --verify refs/tags/v3.5.1 >/dev/null
          git merge-base --is-ancestor "$(git rev-parse v3.5.1)" HEAD
          if git rev-parse -q --verify refs/tags/v3.5.2 >/dev/null; then
            echo "v3.5.2 already exists: refusing overwrite" >&2
            exit 1
          fi
          git diff --name-only v3.5.1 HEAD > /tmp/v352-changes
          test -s /tmp/v352-changes
          if grep -Ev '^(README[.]md|interchain/config[.]go|interchain/config_test[.]go|RELEASE_NOTES_v3[.]5[.]2(_CANDIDATE)?[.]md|[.]github/workflows/release-light-v352[.]yml)$' /tmp/v352-changes; then
            echo "v3.5.2 scope violation relative to v3.5.1" >&2
            exit 1
          fi
          grep -Fxq 'interchain/config.go' /tmp/v352-changes
          grep -Fxq 'interchain/config_test.go' /tmp/v352-changes
          grep -Fxq '.github/workflows/release-light-v352.yml' /tmp/v352-changes
          test -f RELEASE_NOTES_v3.5.2.md
          test -z "$(git diff --name-only v3.5.1 HEAD -- consensus/ blockchain/ state/ chain/ contracts/ command/ crypto/ txpool/ network/)"
          python3 - <<'PY'
          import pathlib
          import subprocess
          baseline=subprocess.check_output(["git","show","v3.5.1:interchain/config.go"],text=True)
          actual=pathlib.Path("interchain/config.go").read_text()
          old='''  RPCURLs:[]string{"https://bsc-rpc.publicnode.com","https://bsc.drpc.org","https://bnb.api.onfinality.io/public"},
            IndependentOperatorIDs:[]string{"publicnode","drpc","onfinality"},'''
          new='''  // 1RPC passed a receipt/finalized/log preflight for BSC block 133969943
            // on 2026-11-16; full live fee/registry proof and sustained availability
            // are still release/operator gates. Independent operator is not proof of
            // independent upstream node infrastructure.
            RPCURLs:[]string{"https://bsc-rpc.publicnode.com","https://public.1rpc.io/bnb","https://bsc.drpc.org","https://bnb.api.onfinality.io/public"},
            IndependentOperatorIDs:[]string{"publicnode","onerpc","drpc","onfinality"},'''
          # Multi-line YAML run indentation gets stripped by GitHub. These
          # literals are aligned with actual Go source at two-space indentation.
          old="\n".join(line.lstrip() for line in old.splitlines())
          new="\n".join(line.lstrip() for line in new.splitlines())
          norm=lambda text:"\n".join(line.lstrip() for line in text.splitlines())
          before=norm(baseline)
          assert before.count(old)==1,"v3.5.1 BSC policy baseline mismatch"
          assert norm(actual)==before.replace(old,new,1),"unexpected config.go change: not a BSC-only URL addition"
          assert 'func TestBSCAdditionalWitnessPreservesFailClosedPolicy' in pathlib.Path("interchain/config_test.go").read_text()
          print("Exact BSC-only RPC policy delta verified")
          PY
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Interchain and Direct-BLS compatibility regressions
        run: |
          set -euo pipefail
          go test -count=3 -timeout 12m ./interchain/... ./consensus/ibft/interchain ./jsonrpc
          go test -count=5 -timeout 5m ./interchain -run '^(TestV341BSCReceiptPinnedAndPolicyActive|TestBSCAdditionalWitnessPreservesFailClosedPolicy|TestInvalidChainPoliciesFailClosed)$'
          go test -count=3 -timeout 5m ./interchain/evm ./consensus/ibft/interchain -run '^(TestDirect|TestRPC|TestXITADirectMessage)'
      - name: Build immutable v3.5.2 Linux release binary and verify provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          COMMIT="$(git rev-parse --short HEAD)"
          TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          PKG="$(go list -m)/versioning"
          go build -trimpath -o dist/xgrchain-v3.5.2-linux-amd64 \
            -ldflags "-X $PKG.Version=v3.5.2 -X $PKG.Commit=$COMMIT -X $PKG.Branch=XGR3.0 -X $PKG.BuildTime=$TIME" .
          chmod 755 dist/xgrchain-v3.5.2-linux-amd64
          VERSION_OUTPUT="$(./dist/xgrchain-v3.5.2-linux-amd64 version)"
          printf '%s\n' "$VERSION_OUTPUT"
          grep -Fq 'Release version' <<< "$VERSION_OUTPUT"
          grep -Fq 'v3.5.2' <<< "$VERSION_OUTPUT"
          grep -Fq "$COMMIT" <<< "$VERSION_OUTPUT"
          printf '%s\n' v3.5.2 > dist/version.txt
          git rev-parse HEAD > dist/commit.txt
          go version > dist/toolchain.txt
          (cd dist && sha256sum xgrchain-v3.5.2-linux-amd64 version.txt commit.txt toolchain.txt > sha256sums.txt)
          (cd dist && sha256sum -c sha256sums.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: xgr-v3.5.2-bsc-rpc-light-amd64
          path: dist/
          retention-days: 30
          if-no-files-found: error
      - name: Publish immutable v3.5.2 GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: v3.5.2
          name: v3.5.2
          commit: ${{ github.sha }}
          allowUpdates: false
          makeLatest: true
          generateReleaseNotes: false
          artifacts: dist/*
          bodyFile: RELEASE_NOTES_v3.5.2.md
