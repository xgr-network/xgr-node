name: Release Light (XGR v3.3.7 Direct-BLS audit remediation (N-01 N-02 M-06))
# Publish v3.3.7 after repeat-run regression test isolation; tag remains immutable.
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: "Reviewed XGR3.0 40-character commit SHA"
        required: true
        type: string
      confirmation:
        description: "Type RELEASE-v3.3.7 to publish"
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: xgr-v337-light-release
  cancel-in-progress: false
jobs:
  release:
    if: ${{ github.ref == 'refs/heads/XGR3.0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate signed-off revision and strictly interchain scope
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          CONFIRMATION: ${{ inputs.confirmation }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/XGR3.0'
          git rev-parse -q --verify refs/tags/v3.3.6 >/dev/null
          git merge-base --is-ancestor 7b8c88a172cb2d7f14af785955f476981bcfb582 HEAD
          if test "$GITHUB_EVENT_NAME" = workflow_dispatch; then
            test "$CONFIRMATION" = 'RELEASE-v3.3.7'
            [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
            test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          else
            echo "Explicit reviewed workflow_dispatch is required" >&2
            exit 1
          fi
          if git rev-parse -q --verify refs/tags/v3.3.7 >/dev/null ||
             gh api "repos/${{ github.repository }}/git/ref/tags/v3.3.7" >/dev/null 2>&1; then
            echo "v3.3.7 already exists; immutable release refused" >&2
            exit 1
          fi
          git diff --name-only v3.3.6 HEAD > /tmp/v337-files
          test -s /tmp/v337-files
          if grep -Ev '^(interchain/evm/iln_direct_operation(_test)?\.go|interchain/runtime/(iln_discovery|iln_observer_retry|iln_observer_worker)(_test)?\.go|\.github/workflows/release-light-v337\.yml)$' /tmp/v337-files; then
            echo 'Out-of-scope change: light release forbidden' >&2
            exit 1
          fi
          test -z "$(git diff --name-only v3.3.6 HEAD -- consensus/ blockchain/ state/ chain/ contracts/ command/ jsonrpc/)"
          test -f interchain/evm/iln_multi_gateway_scan.go
          test -e interchain/evm/rpc_evidence_quorum.go
          test ! -e interchain/evm/iln_merkle.go
          test -e interchain/evm/rpc_transport.go
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Direct-BLS security and M-04 cancellation regressions
        shell: bash
        run: |
          set -euo pipefail
          go test -count=3 -timeout 12m ./interchain ./interchain/evm ./interchain/runtime ./consensus/ibft/interchain ./jsonrpc
          go test -count=5 ./interchain/evm -run '^Test(TwoIndependentOperatorsWithFailover|OneOperatorAndConflictingProvidersFailClosed|IndependentSourceWitness|ILNRPCRequestCancellationOnWorkerShutdown|ILNRPCRejectsOversizedResponseAndMismatchedID)'
      - name: v3.3.7 audit remediation and independent witness regression tests
        shell: bash
        run: |
          set -euo pipefail
          go test -count=3 -timeout 12m ./interchain/evm -run '^TestDirectReceipt'
          go test -count=3 -timeout 12m ./interchain/runtime -run '^Test(SharedObserver|ObserverRetry|ILNHintQueue)'
      - name: Validate native XGR reader integration
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'VerifyNativeXGROperation' interchain/runtime/iln_direct_signing.go
          grep -q 'NativeXGRBlock' consensus/ibft/interchain_runtime.go
          ! grep -q 'rpc.thirdweb.com' interchain/config.go
      - name: Diagnose runner RPC reachability (advisory; runtime quorum stays fail-closed)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re,json,urllib.request,urllib.error
          source=open('interchain/config.go',encoding='utf-8').read()
          # XGR 1643 uses each validator's local committed IBFT blockchain and receipts.
          # Only L2 sources require two independent remote RPC operators.
          for name,chain_id in [('base',8453),('arbitrum',42161)]:
              m=re.search(r'\{Name:"'+name+r'".*?RPCURLs:\[\]string\{([^}]+)\},\s*IndependentOperatorIDs:\[\]string\{([^}]+)\}',source,re.S)
              if not m: raise SystemExit('RPC policy missing: '+name)
              urls=re.findall(r'"([^"]+)"',m.group(1));ops=re.findall(r'"([^"]+)"',m.group(2))
              if len(urls)<3 or len(urls)!=len(ops): raise SystemExit('Insufficient RPC endpoints '+name)
              if len(set(ops))<2: raise SystemExit('Insufficient independent RPC operator identities: '+name)
              good=set()
              for url,operator in zip(urls,ops):
                  try:
                      body=json.dumps(dict(jsonrpc='2.0',id=1,method='eth_chainId',params=[])).encode()
                      req=urllib.request.Request(url,data=body,headers={'Content-Type':'application/json'},method='POST')
                      with urllib.request.urlopen(req,timeout=8) as res: data=json.load(res)
                      if int(data['result'],16)!=chain_id: raise ValueError('wrong chain')
                      if chain_id!=1643:
                          safe=json.dumps(dict(jsonrpc='2.0',id=2,method='eth_getBlockByNumber',params=['safe',False])).encode()
                          req=urllib.request.Request(url,data=safe,headers={'Content-Type':'application/json'},method='POST')
                          with urllib.request.urlopen(req,timeout=8) as res: block=json.load(res).get('result')
                          if not block or not block.get('hash'):raise ValueError('no safe finality')
                      good.add(operator)
                  except Exception as exc:
                      print('Provider unavailable',name,operator,url,str(exc)[:160])
              print(name,'independent active operators:',len(good))
              if len(good)<2:
                  print('::warning title=GitHub Actions RPC probe::'+name+' reachable independent providers from runner: '+str(len(good))+'; live RPC connectivity is environment-dependent. Direct-BLS runtime independently requires two matching complete witnesses and fails closed otherwise.')
          PY
      - name: Build binary and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          COMMIT="$(git rev-parse --short HEAD)"
          TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          PKG=github.com/xgr-network/xgrchain/versioning
          go build -trimpath -o dist/xgrchain-v3.3.7-linux-amd64 \
            -ldflags "-X ${PKG}.Version=v3.3.7 -X ${PKG}.Commit=${COMMIT} -X ${PKG}.Branch=XGR3.0 -X ${PKG}.BuildTime=${TIME}" .
          chmod 755 dist/xgrchain-v3.3.7-linux-amd64
          ./dist/xgrchain-v3.3.7-linux-amd64 version
          printf '%s\n' v3.3.7 > dist/version.txt
          git rev-parse HEAD > dist/commit.txt
          (cd dist && sha256sum xgrchain-v3.3.7-linux-amd64 version.txt commit.txt > sha256sums.txt)
          (cd dist && sha256sum -c sha256sums.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: xgr-v3.3.7-direct-bls-audit-light-linux-amd64
          path: dist/
          retention-days: 30
          if-no-files-found: error
      - name: Publish immutable v3.3.7 release
        uses: ncipollo/release-action@v1
        with:
          tag: v3.3.7
          name: v3.3.7
          commit: ${{ github.sha }}
          allowUpdates: false
          makeLatest: true
          generateReleaseNotes: false
          artifacts: dist/*
          body: |
            XGR v3.3.7 (light release): narrowly scoped Direct-BLS audit repairs.
            N-02: authenticate and match the unique target Mailbox dispatch in multi-dispatch source receipts (PR #71).
            N-01: crash-safe observer retry journal, bounded replay and healthy sibling operation progress (PR #72).
            M-06: fair expiring route-hint discovery; no hint permits signing without independently authenticated Registry evidence (PR #73).
            Base and Arbitrum safe finality and independently verified source witnesses remain mandatory.
            No changes to ordinary IBFT/PoS consensus, state transitions, staking or contracts.
            M-05 and residual H-01 risks are not declared fixed.
            Includes focused and repeated regression tests and SHA256-verified Linux/amd64 binary.
            No claims of production deployment or verified end-to-end token transfers.
