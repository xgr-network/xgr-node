name: Release (XGR v3.3.2 Interchain Only)

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: "Reviewed full XGR3.0 commit SHA (40 lowercase hex)"
        required: true
        type: string
      confirmation:
        description: "Type RELEASE-v3.3.2 to authorize the immutable release"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: xgr-v332-interchain-light-release
  cancel-in-progress: false

jobs:
  build-and-release:
    if: ${{ github.ref == 'refs/heads/XGR3.0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pin reviewed revision and forbid core consensus modifications
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          CONFIRMATION: ${{ inputs.confirmation }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "RELEASE-v3.3.2"
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$GITHUB_REF" = 'refs/heads/XGR3.0'
          test "$(git rev-parse v3.3.1)" = "e6fecf8de08e7261afb24014b3d2d56ccbc8eb40"
          if git rev-parse -q --verify refs/tags/v3.3.2 >/dev/null || gh api "repos/${{ github.repository }}/git/ref/tags/v3.3.2" >/dev/null 2>&1; then
            echo "Immutable v3.3.2 release already exists" >&2
            exit 1
          fi

          git diff --name-only v3.3.1 HEAD > /tmp/xgr-v332-scope.txt
          test -s /tmp/xgr-v332-scope.txt
          if grep -Ev '^(interchain/.*|consensus/ibft/interchain_runtime.go|consensus/ibft/interchain/iln_protocol.go|jsonrpc/xgr_interchain_validators_test.go|merkle-tree/.*|docs/XGR_INTERCHAIN_V332.md|\.github/workflows/(release-v332|release-direct-bls-candidate)\.yml)' /tmp/xgr-v332-scope.txt; then
            echo "Forbidden out-of-scope change for v3.3.2" >&2
            exit 1
          fi
          if git diff --name-only v3.3.1 HEAD -- consensus/ibft/ |
             grep -Ev '^consensus/ibft/(interchain_runtime.go|interchain/iln_protocol.go)$'; then
            echo "Core IBFT files changed" >&2
            exit 1
          fi
          test -z "$(git diff --name-only v3.3.1 HEAD -- blockchain/ state/ contracts/staking/)"
          if git diff --name-status v3.3.1 HEAD -- merkle-tree/ |
             grep -Ev '^D[[:space:]]'; then
            echo "v3.3.2 can only DELETE the unused standalone Merkle package" >&2
            exit 1
          fi
          grep -q 'if len(destinations) == 0' consensus/ibft/interchain_runtime.go

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: Security and fail-closed policy checks
        shell: bash
        run: |
          set -euo pipefail
          test -f interchain/config.go
          test -f interchain/evm/finality.go
          test ! -e merkle-tree/merkle_tree.go
          test -f consensus/ibft/interchain/xita_direct_message.go
          test -f interchain/evm/iln_direct_operation.go
          test -f interchain/runtime/iln_direct_signing.go
          test ! -e interchain/evm/iln_merkle.go
          test ! -e interchain/runtime/iln_replica_network.go
          test ! -e jsonrpc/xgr_iln_replica_proof.go
          go test -count=3 ./interchain -run 'TestV332|TestInvalidChainPolicies'
          go test -count=3 ./interchain/evm -run 'TestSafeFinality|TestIBFTFinality|TestReceiptMustMatch|TestLegacyInterchainENV|TestInterchainEnvironment'

      - name: Full Go regression suite (including consensus, state and staking)
        shell: bash
        run: |
          set -euo pipefail
          pkgs=$(go list ./... | grep -vE '(/e2e($|/)|/e2e-polybft($|/)|/tests($|/)|/tracker($|/)|/command/rootchain/deploy($|/)|/consensus/polybft($|/)|/state/runtime/evm($|/))')
          go test -count=1 -short -timeout 20m $pkgs

      - name: Three-validator Direct-BLS and route E2E
        shell: bash
        run: |
          set -euo pipefail
          go test ./e2e -list '^TestInterchainBLSVerificationPrecompileE2E$' | grep -Fx TestInterchainBLSVerificationPrecompileE2E
          go test ./interchain/runtime -list '^TestILNRoutePeerDiscoveryThreeValidatorsWithoutHistoricalLogs$' | grep -Fx TestILNRoutePeerDiscoveryThreeValidatorsWithoutHistoricalLogs
          go test -count=1 -timeout 180s ./e2e -run '^TestInterchainBLSVerificationPrecompileE2E$'
          go test -count=1 -timeout 180s ./interchain/runtime -run '^TestILNRoutePeerDiscoveryThreeValidatorsWithoutHistoricalLogs$'
          go build ./...

      - name: Direct-BLS focused regression
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 -timeout 12m ./consensus/ibft/interchain ./interchain/evm ./interchain/runtime ./jsonrpc
          go test -count=3 ./consensus/ibft/interchain -run '^TestXITADirectMessage'
          go test -count=3 ./interchain/evm -run '^TestDirect'

      - name: Build XGR v3.3.2 Linux binary and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSION=v3.3.2
          PKG=github.com/xgr-network/xgrchain/versioning
          COMMIT="$(git rev-parse --short HEAD)"
          TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          go build -trimpath -o dist/xgrchain-v3.3.2-linux-amd64 \
            -ldflags "-X ${PKG}.Version=${VERSION} -X ${PKG}.Commit=${COMMIT} -X ${PKG}.Branch=XGR3.0 -X ${PKG}.BuildTime=${TIME}" .
          chmod 755 dist/xgrchain-v3.3.2-linux-amd64
          ./dist/xgrchain-v3.3.2-linux-amd64 version
          printf '%s\n' v3.3.2 > dist/version.txt
          git rev-parse HEAD > dist/commit.txt
          (cd dist && sha256sum xgrchain-v3.3.2-linux-amd64 version.txt commit.txt > sha256sums.txt)
          (cd dist && sha256sum -c sha256sums.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: xgr-v3.3.2-interchain-only-linux-amd64
          path: dist/
          retention-days: 30
          if-no-files-found: error

      - name: Publish immutable v3.3.2 release
        uses: ncipollo/release-action@v1
        with:
          tag: v3.3.2
          name: v3.3.2
          commit: ${{ github.sha }}
          allowUpdates: false
          makeLatest: true
          generateReleaseNotes: false
          body: |
            XGR v3.3.2: typed immutable Interchain chain policy, safe/IBFT
            finality, canonical source receipt verification and legacy Merkle
            cleanup. No consensus, EVM, state or staking changes. Interchain
            worker bindings activate XGRChain, Base and Arbitrum; Polygon disabled.
            Full Go suite and focused Direct-BLS security regression tested.
            Regular Interchain release with Go unit, IBFT-state and three-validator E2E gates; EEST/ForkGate not rerun because consensus and EVM are unchanged.
          artifacts: dist/*
