            XGR v3.3.5 Interchain-only light release: chain-generic source observer retry correction and persistent Direct-BLS health cursor recovery.
            A shared Base/Arbitrum source RPC failure counts once per source poll, not once per route; routing-specific failures retain individual retry gates.
            Read-only health recovers persisted per-route Direct-BLS scan cursors after restart/temporary RPC failures without inventing a verified source head.
            Exposes sourceHeadKnown, scanCursorKnown and lastSuccessfulScanUnix in the read-only ILN indexer status RPC.
            Base/Arbitrum still require two independently agreeing source RPC operator witnesses and canonical safe finality for BLS signatures.
            No ordinary consensus/IBFT, staking, state, contracts, custody or fee policy changes.
            Focused tests, advisory runner RPC diagnostics, and a checksum-verified Linux binary.
            M-05 isolation stress verification and bidirectional production on-chain E2E remain outside this light release.
