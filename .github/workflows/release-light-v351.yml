name: Release Light (XGR v3.5.1 F-20 Recovery Direct-BLS)
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: "Reviewed XGR3.0 40-character commit SHA"
        required: true
        type: string
      confirmation:
        description: "Type RELEASE-v3.5.1 to publish"
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: xgr-v351-light-release
  cancel-in-progress: false
jobs:
  release:
    if: ${{ github.ref == 'refs/heads/XGR3.0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact reviewed commit, baseline and interchain scope
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/XGR3.0'
          test "$CONFIRMATION" = 'RELEASE-v3.5.1'
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          git rev-parse -q --verify refs/tags/v3.5.0 >/dev/null
          git merge-base --is-ancestor "$(git rev-parse v3.5.0)" HEAD
          if git rev-parse -q --verify refs/tags/v3.5.1 >/dev/null; then
            echo "v3.5.1 already exists" >&2; exit 1
          fi
          # Diff against last published release, not just against the PR.
          # Historical v3.5.0 documentation fixes were merged after the tag.
          git diff --name-only v3.5.0 HEAD > /tmp/v351-changes
          test -s /tmp/v351-changes
          if grep -Ev '^(interchain/runtime/iln_checkpoint[.]go|interchain/runtime/iln_f20_successor_test[.]go|README[.]md|RELEASE_NOTES_v3[.]5[.]0[.]md|RELEASE_NOTES_v3[.]5[.]1[.]md|docs/ILN_V340_OPERATOR_REFERENCE[.]md|docs/security/v3[.]5[.]0(-final-review|-rollout|-validation)?[.]md|[.]github/workflows/release-light-v351[.]yml)$' /tmp/v351-changes; then
            echo "F-20 light release exceeded reviewed interchain and documentation scope" >&2
            exit 1
          fi
          # Never label staking, consensus, VM or chain database changes as a light release.
          test -z "$(git diff --name-only v3.5.0 HEAD -- consensus/ blockchain/ state/ chain/ contracts/ command/ crypto/ txpool/ network/)"
          grep -q 'hasDurableILNSuccessorVote' interchain/runtime/iln_checkpoint.go
          grep -q 'return dir.Sync()' interchain/runtime/iln_checkpoint.go
          grep -q 'TestF20DurableSuccessorRequiredBeforeOldVoteDeletion' interchain/runtime/iln_f20_successor_test.go
          test -f RELEASE_NOTES_v3.5.1.md
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      # Post-PoP F-20 recovery-only patch. No full EEST/PoS/ForkGate
      # or smart contract redeploy is required for a non-consensus change.
      - name: Existing interchain / Direct-BLS compatibility regressions
        shell: bash
        run: |
          set -euo pipefail
          go test -count=3 -timeout 12m ./interchain/... ./consensus/ibft/interchain ./jsonrpc
      - name: F-20 durable-journal and exact-current-set recovery negatives
        shell: bash
        run: |
          set -euo pipefail
          go test -count=8 -timeout 8m ./interchain/runtime -run 'TestF20'
          go test -count=3 -timeout 5m ./interchain/evm ./consensus/ibft/interchain -run '^(TestDirect|TestXITADirectMessage)'
      - name: Build versioned immutable candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          COMMIT="$(git rev-parse --short HEAD)"
          TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          PKG="$(go list -m)/versioning"
          go build -trimpath -o dist/xgrchain-v3.5.1-linux-amd64 \
            -ldflags "-X ${PKG}.Version=v3.5.1 -X ${PKG}.Commit=${COMMIT} -X ${PKG}.Branch=XGR3.0 -X ${PKG}.BuildTime=${TIME}" .
          chmod 755 dist/xgrchain-v3.5.1-linux-amd64
          VERSION_OUTPUT="$(./dist/xgrchain-v3.5.1-linux-amd64 version)"
          printf '%s\n' "$VERSION_OUTPUT"
          grep -Fq 'Release version' <<< "$VERSION_OUTPUT"
          grep -Fq 'v3.5.1' <<< "$VERSION_OUTPUT"
          grep -Fq "$COMMIT" <<< "$VERSION_OUTPUT"
          printf '%s\n' v3.5.1 > dist/version.txt
          git rev-parse HEAD > dist/commit.txt
          go version > dist/toolchain.txt
          (cd dist && sha256sum xgrchain-v3.5.1-linux-amd64 version.txt commit.txt toolchain.txt > sha256sums.txt)
          (cd dist && sha256sum -c sha256sums.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: xgr-v3.5.1-f20-recovery-light-amd64
          path: dist/
          retention-days: 30
          if-no-files-found: error
      - name: Publish immutable v3.5.1 release
        uses: ncipollo/release-action@v1
        with:
          tag: v3.5.1
          name: v3.5.1
          commit: ${{ github.sha }}
          allowUpdates: false
          makeLatest: true
          generateReleaseNotes: false
          artifacts: dist/*
          bodyFile: RELEASE_NOTES_v3.5.1.md
