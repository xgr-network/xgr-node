name: Release Light (ILN RPC Hotfix v3.2.1)

on:
  push:
    branches: [XGR3.0]

permissions:
  contents: write

concurrency:
  group: xgr-v321-light-release
  cancel-in-progress: false

jobs:
  build-and-release:
    if: "contains(github.event.head_commit.message, 'release-light: XGR-Node v3.2.1')"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: Focused ILN regression and three-validator tests
        run: |
          set -euo pipefail
          go test -count=1 -short ./interchain/evm ./interchain/runtime ./jsonrpc
          go test -count=1 ./interchain/runtime -run '^(TestV321ILN|TestILNReplicaThreeAuthenticatedLibp2pValidatorsE2E|TestILNRoutePeerDiscoveryThreeValidatorsWithoutHistoricalLogs|TestILNValidatorRestartRetainsVerifiedReplicaAndPerSetCursor)$' -timeout 180s -v

      - name: Build official v3.2.1 node binary
        run: |
          set -euo pipefail
          mkdir -p dist
          COMMIT="$(git rev-parse --short HEAD)"
          TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          PKG=github.com/xgr-network/xgrchain/versioning
          VERSION=v3.2.1
          go build -trimpath -o dist/xgrchain-v3.2.1-linux-amd64 \
            -ldflags "-X ${PKG}.Version=${VERSION} -X ${PKG}.Commit=${COMMIT} -X ${PKG}.Branch=XGR3.0 -X ${PKG}.BuildTime=${TIME}" .
          chmod 755 dist/xgrchain-v3.2.1-linux-amd64
          ./dist/xgrchain-v3.2.1-linux-amd64 version
          printf '%s\n' 'v3.2.1' > dist/version.txt
          (cd dist && sha256sum xgrchain-v3.2.1-linux-amd64 version.txt > sha256sums.txt)
          test -s dist/xgrchain-v3.2.1-linux-amd64
          cat dist/sha256sums.txt

      - name: Verify no existing v3.2.1 tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api repos/${{ github.repository }}/git/ref/tags/v3.2.1 >/dev/null 2>&1; then
            echo 'v3.2.1 tag already exists - refusing to overwrite' >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: xgr-v3.2.1-light-linux-amd64
          path: dist/
          retention-days: 14

      - name: Publish immutable build and checksums
        uses: ncipollo/release-action@v1
        with:
          tag: v3.2.1
          name: v3.2.1
          commit: ${{ github.sha }}
          makeLatest: true
          allowUpdates: false
          generateReleaseNotes: false
          body: |
            Targeted XGR v3.2.1 ILN RPC hotfix; existing consensus, cryptographic
            proofs and smart contracts are unchanged.
            Scoped ILN regression/build and 3-validator tests passed.
            The full EEST/ForkGate suite was NOT run for this light release.
            Deploy validator-by-validator after independent backups and health checks.
          artifacts: 'dist/*'
